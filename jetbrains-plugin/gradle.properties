# Conservative JVM args — Gradle's daemon defaults to 512m which
# OOMs the IntelliJ Platform plugin's resolution step on first
# build. Bump to 2g.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

# Required by Kotlin DSL on JDK 21 to silence the "future
# incompatible" warnings on the IntelliJ Platform plugin's
# internals. Safe to remove once IntelliJ Platform Plugin 2.x
# fully migrates off the deprecated APIs.
kotlin.code.style=official
