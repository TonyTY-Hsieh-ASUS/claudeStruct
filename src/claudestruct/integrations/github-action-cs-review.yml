# GitHub Actions workflow that runs `cs review` on every pull request and
# posts the verdict as a PR comment.
#
# Install: copy this file to .github/workflows/cs-review.yml in your repo,
# then set repository secret ANTHROPIC_API_KEY.
#
# Trigger: PRs against main / claude/* branches. Adjust `branches` to match
# your repo's convention.
#
# Cost guard: the workflow passes --max-bytes 200000 (the review default
# task budget) so a runaway diff doesn't burn through your spend cap.

name: cs review

on:
  pull_request:
    branches:
      - main
      - master
      - 'claude/**'

permissions:
  pull-requests: write    # post comments
  contents: read

jobs:
  cs-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the merge base so `cs review` can diff against the
          # PR's target. fetch-depth: 0 is the cheapest thing that works
          # across all PR shapes (merge / squash / rebase).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install claudestruct
        run: pip install -e .

      - name: Run cs review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          cs review --max-bytes 200000 > review.md 2>&1
          status=$?
          # cs exits 0 on success; we don't want a non-zero status to
          # fail the workflow — the comment is the deliverable.
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### cs review\n\n<details><summary>verdict</summary>\n\n\`\`\`\n${body}\n\`\`\`\n\n</details>`,
            });
