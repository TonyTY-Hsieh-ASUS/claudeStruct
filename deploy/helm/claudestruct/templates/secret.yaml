{{- if not .Values.secrets.existingSecret -}}
{{- /*
   Inline Secret rendered when no existingSecret is provided. Holds
   the Anthropic API key, Stripe credentials, and DB URL. NOT
   recommended for prod: prefer a SealedSecret / ExternalSecrets /
   AWS Secrets Manager integration so values never live in chart
   values files or values overrides on disk.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claudestruct.secretName" . }}
  labels:
    {{- include "claudestruct.labels" . | nindent 4 }}
type: Opaque
stringData:
  anthropicApiKey: {{ .Values.secrets.inline.anthropicApiKey | quote }}
  stripeSecretKey: {{ .Values.secrets.inline.stripeSecretKey | quote }}
  stripeWebhookSecret: {{ .Values.secrets.inline.stripeWebhookSecret | quote }}
  databaseUrl: {{ .Values.config.databaseUrl | quote }}
{{- end -}}
